name: 🎓 Autograding: Student Submission

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  autograde:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"
          pip install pytest-json-report>=1.6.0
      
      - name: Install Playwright
        run: playwright install chromium --with-deps
      
      - name: Run autograder
        uses: classroom-resources/autograding-io-grader@v1
        with:
          setup-command: |
            playwright install chromium --with-deps
          command: |
            pytest tests/ \
              -m mobile \
              --browser chromium \
              --json-report \
              --json-report-file=output/autograde-results.json \
              -v
          timeout: 30
          max-score: 100
      
      - name: Upload detailed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autograde-detailed
          path: |
            output/autograde-results.json
            output/allure-results/
          retention-days: 14